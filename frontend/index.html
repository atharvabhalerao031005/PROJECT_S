<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231C1310' stroke='%23B8772F' stroke-width='2'/><path d='M11 19c0-2.8 2.2-5 5-5s5 2.2 5 5' stroke='%23D2AE82' stroke-width='2' fill='none' stroke-linecap='round'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATELIER // PRESENCE — Multimodal Attendance &amp; Engagement Telemetry</title>
    
    <!-- Google Fonts: Fraunces, Instrument Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(e) {
        var box = document.getElementById('atelier-boot-error');
        if (!box) {
          box = document.createElement('div');
          box.id = 'atelier-boot-error';
          box.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#1C1310;color:#B8772F;padding:40px;font-family:monospace;font-size:15px;z-index:999999;overflow:auto;';
          document.body.appendChild(box);
        }
        box.innerHTML = '<h2 style="color:#F7F0E3;border-bottom:1px solid #B8772F;padding-bottom:8px;">ATELIER // SYSTEM SCRIPT ERROR</h2>' +
          '<p style="color:#EBDCC2;font-size:16px;"><b>' + e.message + '</b></p>' +
          '<p style="color:#D2AE82;">Location: ' + e.filename + ':' + e.lineno + ':' + e.colno + '</p>' +
          '<pre style="background:#3A2619;color:#F7F0E3;padding:16px;border:1px solid #6B4630;white-space:pre-wrap;">' + (e.error ? e.error.stack : 'No stack') + '</pre>';
      });
    </script>
  </head>
  <body class="bg-espresso text-foam selection:bg-caramel selection:text-espresso antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
